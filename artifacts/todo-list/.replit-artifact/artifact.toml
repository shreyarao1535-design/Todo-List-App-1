kind = "web"
previewPath = "/"
title = "Todo List"
description = "A personal todo list for capturing tasks, setting due dates and priorities, and tracking what is complete. Tasks are saved locally in the browser."
version = "1.0.0"
id = "artifacts/todo-list"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19971

[services.development]
run = "pnpm --filter @workspace/todo-list run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/todo-list", "run", "build" ]
serve = "static"
publicDir = "artifacts/todo-list/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19971"
BASE_PATH = "/"
